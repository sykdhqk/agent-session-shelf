<style>
:root{--paper:#f5f2e9;--white:#fffcf5;--ink:#253543;--muted:#63707a;--line:#cfd3d0;--accent:#a04b2c;--blue:#315976;--wash:#e5e9e7;--error:#982d28}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 Verdana,"PingFang SC",sans-serif}main{max-width:1100px;margin:auto;padding:24px}header{border-top:5px solid var(--ink);padding-top:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow,.mono{font:11px/1.6 Menlo,monospace;letter-spacing:.06em}h1{font:normal clamp(31px,5vw,48px)/1.12 Georgia,"Songti SC",serif;margin:14px 0}h2{font:normal 23px/1.2 Georgia,"Songti SC",serif;margin:8px 0 16px}p{margin:10px 0}.muted,small{color:var(--muted)}button,input,textarea{font:inherit;color:var(--ink)}button{border:1px solid var(--line);background:var(--white);padding:9px 12px;cursor:pointer;border-radius:2px}button:hover{background:var(--wash)}button.primary{background:var(--ink);border-color:var(--ink);color:white}:focus-visible{outline:3px solid #bd6c31;outline-offset:3px}input,textarea{border:1px solid var(--line);padding:9px;background:var(--white);width:100%;border-radius:2px}textarea{font:12px/1.5 Menlo,monospace;resize:vertical;min-height:130px}label{display:block;font-size:11px;font-weight:bold;margin:10px 0 4px}summary{cursor:pointer;font-weight:bold}.import{padding:16px 0;border-block:1px solid var(--line);margin:20px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.policy{display:grid;grid-template-columns:repeat(3,minmax(90px,1fr));gap:12px}.clock{max-width:350px}.counts{display:flex;flex-wrap:wrap;gap:0;border-block:2px solid var(--ink);margin:22px 0}.counts>div{flex:1;min-width:110px;padding:14px 12px 14px 0}.counts strong{font:32px/1 Georgia,serif;display:block}.counts span{display:block;font:10px/1.5 Menlo,monospace;margin-top:6px}.columns{display:grid;grid-template-columns:minmax(260px,1.2fr) minmax(230px,1fr);gap:24px}#filter{display:flex;gap:6px;flex-wrap:wrap}#filter button{font-size:11px;padding:6px 8px}#filter button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:white}ol{padding:0;margin:0;list-style:none}.row{border-top:1px solid var(--line)}.row button{padding:14px 8px;text-align:left;width:100%;border:0;background:transparent;border-radius:0}.row button[aria-pressed=true]{background:var(--wash);box-shadow:inset 3px 0 var(--blue)}.rowtop{display:flex;justify-content:space-between;gap:10px}.badge{font:10px/1.5 Menlo,monospace;color:var(--blue);border:1px solid currentColor;padding:1px 5px}.badge.retire,.badge.review{color:var(--accent)}.name{display:block;font-size:15px;margin:6px 0}.meta{font-size:11px;color:var(--muted);overflow-wrap:anywhere}.detail{background:var(--white);border-top:3px solid var(--accent);padding:18px;align-self:start;overflow-wrap:anywhere}dl{margin:0}dt{font-size:11px;color:var(--muted);margin-top:12px}dd{margin:3px 0;font-size:13px}#reasons{padding-left:18px;font-size:13px}#prs{font:12px/1.6 Menlo,monospace;white-space:pre-wrap}.notice{border-left:3px solid var(--blue);padding-left:10px;font-size:12px}#error{background:#ffebe4;border-left:4px solid var(--error);color:var(--error);padding:12px;overflow-wrap:anywhere}.empty{padding:25px 0}.output{border-top:2px solid var(--ink);margin-top:24px;padding-top:16px}footer{border-top:1px solid var(--line);padding:20px 0 0;margin-top:24px;font-size:11px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:700px){main{padding:17px}.columns{grid-template-columns:1fr}.counts>div{min-width:95px}.policy{gap:7px}.detail{padding:15px}h1{font-size:34px}}

<header><div class="top"><span class="eyebrow">WORKSPACE REGISTER / 会话登记</span><button id="language" aria-label="Change language / 切换语言">中文</button></div><h1 id="title">Agent Session Shelf</h1><p id="subtitle" class="muted"></p><span id="connection" class="mono">Connecting…</span></header>

<section id="workspace" hidden><h2 id="inventory-title"></h2><p id="planning-note" class="notice"></p><label for="asof" id="asof-label"></label><input id="asof" class="clock" spellcheck="false" aria-label="Snapshot time / 快照时间"><div class="policy"><div><label for="inactive" id="inactive-label"></label><input id="inactive" type="number" min="0" step="1" aria-label="Inactivity hours / 无活动小时"></div><div><label for="grace" id="grace-label"></label><input id="grace" type="number" min="0" step="1" aria-label="Grace hours / 宽限期小时"></div><div><label for="fresh" id="fresh-label"></label><input id="fresh" type="number" min="1" step="1" aria-label="Evidence age hours / 证据时效小时"></div></div><div class="toolbar"><button id="apply" class="primary"></button><button id="export-json"></button><button id="export-md"></button></div><div class="counts" id="counts" aria-live="polite"></div>
<div class="columns"><section><div class="toolbar"><span id="filter-label" class="mono"></span><div id="filter" role="group" aria-label="Session filter / 会话筛选"></div></div><ol id="items"></ol></section><aside class="detail" id="detail" hidden><div class="mono" id="detail-id"></div><h2 id="detail-title"></h2><ul id="reasons"></ul><dl id="facts"></dl><div class="toolbar"><button id="pin"></button></div><small id="pin-note"></small></aside></div></section>

<script>
const DISPOSITIONS=['archive','cooldown','retire','keep','review'];
function shape(o,keys,at){if(!o||typeof o!=='object'||Array.isArray(o))throw Error(at+' must be an object');for(const k of keys)if(!Object.hasOwn(o,k))throw Error(at+': missing '+k);for(const k of Object.keys(o))if(!keys.includes(k))throw Error(at+': unknown '+k);}
function text(v,at,max=200){if(typeof v!=='string'||!v.trim()||v.length>max)throw Error(at+' must be nonempty text (max '+max+')');}
function timestamp(v,at){if(typeof v!=='string'||!/^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d{3})?Z$/.test(v))throw Error(at+' must be a UTC ISO timestamp');const n=Date.parse(v);if(!Number.isFinite(n)||new Date(n).toISOString()!==v.replace(/(?<!\.\d{3})Z$/,'.000Z'))throw Error(at+' is not a real UTC date');return n;}
function integer(v,at,min,max){if(!Number.isInteger(v)||v<min||v>max)throw Error(at+' must be an integer from '+min+' to '+max);}
function validateInventory(input){
 shape(input,['schemaVersion','title','asOf','policy','sessions'],'inventory');if(input.schemaVersion!==1)throw Error('Expected schemaVersion 1');text(input.title,'title');const now=timestamp(input.asOf,'asOf');
 shape(input.policy,['inactiveHours','graceHours','maxEvidenceAgeHours'],'policy');for(const k of ['inactiveHours','graceHours'])integer(input.policy[k],k,0,87600);integer(input.policy.maxEvidenceAgeHours,'maxEvidenceAgeHours',1,87600);
 if(!Array.isArray(input.sessions)||input.sessions.length>200)throw Error('sessions must be an array with at most 200 entries');const ids=new Set();
 for(const s of input.sessions){shape(s,['id','title','repository','lastActivityAt','checkedAt','running','dirty','pinned','archivedAt','pullRequests'],'session');text(s.id,'session.id',80);if(!/^[A-Za-z0-9_-]+$/.test(s.id)||ids.has(s.id))throw Error('Invalid or duplicate session id');ids.add(s.id);text(s.title,'session.title',300);text(s.repository,'repository',200);
  for(const k of ['lastActivityAt','checkedAt','archivedAt'])if(s[k]!==null){if(timestamp(s[k],s.id+'.'+k)>now)throw Error(s.id+'.'+k+' is after asOf');}else if(k==='lastActivityAt')throw Error('lastActivityAt is required');
  for(const k of ['running','dirty'])if(s[k]!==null&&typeof s[k]!=='boolean')throw Error(k+' must be boolean or null');if(typeof s.pinned!=='boolean')throw Error('pinned must be boolean');
  if(s.pullRequests!==null){if(!Array.isArray(s.pullRequests)||s.pullRequests.length>100)throw Error('pullRequests must be null or an array of at most 100 items');const prs=new Set();for(const p of s.pullRequests){shape(p,['number','state'],'pullRequest');integer(p.number,'PR number',1,2147483647);if(prs.has(p.number))throw Error('Duplicate PR number in session');prs.add(p.number);if(!['open','merged','closed','unknown'].includes(p.state))throw Error('Invalid PR state');}}
 }
 return JSON.parse(JSON.stringify(input));
}
function planInventory(input){
 const inventory=validateInventory(input),now=Date.parse(inventory.asOf),p=inventory.policy;
 const items=inventory.sessions.map(s=>{
  const reasons=[],hold=[],unknown=[];const idleHours=(now-Date.parse(s.lastActivityAt))/3600000;
  if(s.pinned)hold.push('pinned');if(s.running===true)hold.push('running');if(s.dirty===true)hold.push('dirty');
  if(s.running===null)unknown.push('running-unknown');if(s.dirty===null)unknown.push('dirty-unknown');
  if(s.checkedAt===null)unknown.push('unchecked');else{if((now-Date.parse(s.checkedAt))/3600000>p.maxEvidenceAgeHours)unknown.push('stale');if(Date.parse(s.checkedAt)<Date.parse(s.lastActivityAt))unknown.push('activity-after-check');}
  if(s.pullRequests===null||s.pullRequests.length===0)unknown.push('prs-missing');else{if(s.pullRequests.some(x=>x.state==='open'))hold.push('pr-open');if(s.pullRequests.some(x=>x.state==='closed'))hold.push('pr-unmerged');if(s.pullRequests.some(x=>x.state==='unknown'))unknown.push('pr-unknown');}
  if(idleHours<p.inactiveHours)hold.push('recent');
  if(s.archivedAt!==null&&Date.parse(s.lastActivityAt)>Date.parse(s.archivedAt))unknown.push('activity-after-archive');
  reasons.push(...hold,...unknown);let disposition,eligibleAt=null;
  if(hold.length)disposition='keep';else if(unknown.length)disposition='review';else if(s.archivedAt===null){disposition='archive';reasons.push('all-merged-inactive');}else{eligibleAt=new Date(Date.parse(s.archivedAt)+p.graceHours*3600000).toISOString();disposition=now>=Date.parse(eligibleAt)?'retire':'cooldown';reasons.push(disposition==='retire'?'grace-elapsed':'grace-pending');}
  return {id:s.id,title:s.title,repository:s.repository,disposition,reasons,idleHours,eligibleAt};
 });
 const counts=Object.fromEntries(DISPOSITIONS.map(k=>[k,items.filter(x=>x.disposition===k).length]));
 return {schemaVersion:1,kind:'agent-session-shelf-plan',asOf:inventory.asOf,inventory,counts,items,execution:'planning-only'};
}
function setPinned(input,id,pinned){const next=validateInventory(input);if(typeof pinned!=='boolean')throw Error('pinned must be boolean');const s=next.sessions.find(s=>s.id===id);if(!s)throw Error('Unknown session');s.pinned=pinned;return next;}
function toMarkdown(input){const p=planInventory(input);const esc=v=>String(v).replaceAll('\\','\\\\').replaceAll('|','\\|').replace(/[\r\n]+/g,' ').replaceAll('<','&lt;').replaceAll('>','&gt;');return ['# Agent Session Shelf / 智能体会话整理清单','',esc(p.inventory.title),'','As of / 快照时间: '+p.asOf,'','Planning only: no session, branch, worktree or file was archived or deleted.','仅生成计划：没有实际归档或删除会话、分支、工作树或文件。','',`Policy / 规则: inactive ${p.inventory.policy.inactiveHours} h; archive grace ${p.inventory.policy.graceHours} h; evidence age ≤ ${p.inventory.policy.maxEvidenceAgeHours} h.`,`Counts / 数量: archive=${p.counts.archive}, cooldown=${p.counts.cooldown}, retire=${p.counts.retire}, keep=${p.counts.keep}, review=${p.counts.review}.`,'','| Session / 会话 | Repository / 仓库 | Disposition / 建议 | Reasons / 依据 | Grace ends / 宽限期结束 |','|---|---|---|---|---|',...p.items.map(x=>`| ${esc(x.id+' · '+x.title)} | ${esc(x.repository)} | ${x.disposition} | ${x.reasons.join(', ')} | ${x.eligibleAt??'—'} |`),'','archive = review marking done; cooldown = wait; retire = review removal, not deletion approval; keep = known hold; review = insufficient or contradictory evidence.','archive 为待审阅归档，cooldown 为宽限期内，retire 为待审阅移除，不代表删除批准；keep 为有明确保留条件，review 为证据不足或矛盾。','','Refresh live PR, worktree and activity evidence before any action. Pinning is a local planning preference, not a change to a connected service.','实际操作前重新核对 PR、工作树和活动状态。固定仅是本计划偏好，不改变外部服务。',''].join('\n');}

const SAMPLE={"schemaVersion":1,"title":"Synthetic agent workspace","asOf":"2026-01-10T12:00:00Z","policy":{"inactiveHours":48,"graceHours":72,"maxEvidenceAgeHours":24},"sessions":[{"id":"S1","title":"Merged adapter fix","repository":"sample/agent-lab","lastActivityAt":"2026-01-05T10:00:00Z","checkedAt":"2026-01-10T11:00:00Z","running":false,"dirty":false,"pinned":false,"archivedAt":null,"pullRequests":[{"number":101,"state":"merged"}]},{"id":"S2","title":"Recently archived tests","repository":"sample/agent-lab","lastActivityAt":"2026-01-05T10:00:00Z","checkedAt":"2026-01-10T11:00:00Z","running":false,"dirty":false,"pinned":false,"archivedAt":"2026-01-09T00:00:00Z","pullRequests":[{"number":102,"state":"merged"}]},{"id":"S3","title":"Archived documentation","repository":"sample/agent-lab","lastActivityAt":"2026-01-05T10:00:00Z","checkedAt":"2026-01-10T11:00:00Z","running":false,"dirty":false,"pinned":false,"archivedAt":"2026-01-05T12:00:00Z","pullRequests":[{"number":103,"state":"merged"}]},{"id":"S4","title":"Unsaved local work","repository":"sample/agent-lab","lastActivityAt":"2026-01-05T10:00:00Z","checkedAt":"2026-01-10T11:00:00Z","running":false,"dirty":true,"pinned":false,"archivedAt":null,"pullRequests":[{"number":104,"state":"merged"}]},{"id":"S5","title":"Review still open","repository":"sample/agent-lab","lastActivityAt":"2026-01-05T10:00:00Z","checkedAt":"2026-01-10T11:00:00Z","running":false,"dirty":false,"pinned":false,"archivedAt":null,"pullRequests":[{"number":105,"state":"open"}]},{"id":"S6","title":"Old evidence snapshot","repository":"sample/agent-lab","lastActivityAt":"2026-01-05T10:00:00Z","checkedAt":"2026-01-08T11:00:00Z","running":false,"dirty":false,"pinned":false,"archivedAt":null,"pullRequests":[{"number":106,"state":"merged"}]},{"id":"S7","title":"No PR evidence","repository":"sample/agent-lab","lastActivityAt":"2026-01-05T10:00:00Z","checkedAt":"2026-01-10T11:00:00Z","running":false,"dirty":false,"pinned":false,"archivedAt":null,"pullRequests":[]},{"id":"S8","title":"Pinned investigation","repository":"sample/agent-lab","lastActivityAt":"2026-01-05T10:00:00Z","checkedAt":"2026-01-10T11:00:00Z","running":false,"dirty":false,"pinned":true,"archivedAt":null,"pullRequests":[{"number":108,"state":"merged"}]},{"id":"S9","title":"Agent still running","repository":"sample/agent-lab","lastActivityAt":"2026-01-05T10:00:00Z","checkedAt":"2026-01-10T11:00:00Z","running":true,"dirty":false,"pinned":false,"archivedAt":null,"pullRequests":[{"number":109,"state":"merged"}]}]};
const $=id=>document.getElementById(id);let current=null,selectedId=null,language='en',activeFilter='all';
const copy={en:{title:'Agent Session Shelf',subtitle:'A clear place for finished work. Review what can be archived, what needs time, and what still deserves attention.',import:'Import a session snapshot',load:'Replace inventory',sample:'Load example',importNote:'Use supplied JSON, not a GitHub export. Import replaces this panel state; export before switching.',planning:'Snapshot-based planning only. Refresh live evidence before any archive or removal.',asof:'As of (UTC ISO timestamp)',inactive:'Inactive for at least (h)',grace:'After archive, wait (h)',fresh:'Evidence no older than (h)',apply:'Recalculate plan',json:'Export inventory JSON',md:'Export review Markdown',archive:'Review archive',cooldown:'Grace period',retire:'Review removal',keep:'Keep',review:'Needs evidence',all:'All sessions',filter:'Show',pin:'Pin in this plan',unpin:'Unpin in this plan',pinNote:'Pinning changes this exported plan only. It does not change the host or a remote session.',emptyTitle:'Finish the work. Keep the context.',emptyNote:'Load the example or import an inventory to review session lifecycle evidence.',exportNote:'Copy to a project file. JSON is re-importable. The model can save inventory and Markdown with get_inventory.',footer:'No deletion or archive commands · No external requests · Export before reload, update or uninstall.',repository:'Repository',activity:'Last activity',checked:'Evidence checked',archived:'Recorded archive time',eligible:'Grace ends',prs:'Pull requests',none:'Not supplied',running:'Running',dirty:'Uncommitted changes',unknown:'Unknown'},zh:{title:'智能体会话整理架',subtitle:'给完成的工作一个清楚的位置。核对待归档、宽限期内与仍需关注的会话。',import:'导入会话快照',load:'替换清单',sample:'载入示例',importNote:'导入本项目格式的 JSON，非 GitHub 原生导出；替换前请先导出当前面板资料。',planning:'按快照生成计划；实际归档或移除前，请重新核对真实状态。',asof:'快照时间（UTC ISO）',inactive:'至少无活动（小时）',grace:'归档后等待（小时）',fresh:'证据最大时效（小时）',apply:'重新计算',json:'导出清单 JSON',md:'导出评审 Markdown',archive:'待审阅归档',cooldown:'宽限期内',retire:'待审阅移除',keep:'保留',review:'待补证据',all:'全部会话',filter:'查看',pin:'在计划中固定',unpin:'取消计划固定',pinNote:'固定只改变可导出的本地计划，不改变宿主或远程会话。',emptyTitle:'结束工作，保留上下文。',emptyNote:'载入示例或导入清单，核对会话整理所需的依据。',exportNote:'复制到项目文件。JSON 可重新导入，也可让模型通过 get_inventory 保存清单及 Markdown。',footer:'不执行归档或删除命令 · 不发起外网请求 · 重载、更新或卸载前请先导出。',repository:'仓库',activity:'最近活动',checked:'证据核对时间',archived:'已记录的归档时间',eligible:'宽限期结束',prs:'拉取请求',none:'未提供',running:'是否运行中',dirty:'是否有未提交修改',unknown:'未知'}};
const reasons={pinned:['Pinned for retention.','已固定保留。'],running:['The agent is still running.','智能体仍在运行。'],dirty:['Uncommitted work is present.','存在未提交修改。'],'running-unknown':['Runner state is unknown.','运行状态未知。'],'dirty-unknown':['Worktree state is unknown.','工作树状态未知。'],unchecked:['No evidence check time supplied.','未提供证据核对时间。'],stale:['Evidence exceeds the freshness window.','证据已超出时效窗口。'],'activity-after-check':['New activity occurred after the evidence check.','核对后出现了新活动。'],'prs-missing':['No associated PR evidence supplied.','未提供关联 PR 证据。'],'pr-open':['A pull request is still open.','仍有未关闭的 PR。'],'pr-unmerged':['A pull request closed without merging.','有 PR 已关闭但未合并。'],'pr-unknown':['A pull request state is unknown.','有 PR 状态未知。'],recent:['The inactivity window has not elapsed.','尚未达到无活动时长。'],'activity-after-archive':['Activity resumed after the recorded archive.','记录归档后又出现活动。'],'all-merged-inactive':['All supplied PRs merged; current snapshot meets archive checks.','提供的 PR 均合并，当前快照满足归档核对项。'],'grace-elapsed':['The recorded archive grace period has elapsed; review before removal.','已过记录的归档宽限期，移除前仍需审阅。'],'grace-pending':['The archive grace period is still running.','归档宽限期尚未结束。']};
const t=k=>copy[language][k];const label=(id,k)=>$(id).textContent=t(k);
function safe(action){try{action();$('error').hidden=true}catch(e){$('error').textContent=e.message;$('error').hidden=false}}
function commit(value){current=validateInventory(value);$('input').value=JSON.stringify(current,null,2);$('export-panel').hidden=true;render()}
function loadInventory(value){const next=validateInventory(value);selectedId=next.sessions[0]?.id??null;activeFilter='all';commit(next);$('import-panel').open=false;return planInventory(current)}
function renderFilters(){const holder=$('filter');holder.setAttribute('aria-label',t('filter'));holder.replaceChildren(...['all',...DISPOSITIONS].map(k=>{const b=document.createElement('button');b.type='button';b.textContent=t(k);b.setAttribute('aria-pressed',String(activeFilter===k));b.onclick=()=>{activeFilter=k;const first=planInventory(current).items.find(x=>k==='all'||x.disposition===k);selectedId=first?.id??null;render()};return b}))}
function translate(){document.documentElement.lang=language==='en'?'en':'zh-CN';for(const [id,k] of Object.entries({'title':'title','subtitle':'subtitle','import-label':'import','load':'load','sample':'sample','import-note':'importNote','planning-note':'planning','asof-label':'asof','inactive-label':'inactive','grace-label':'grace','fresh-label':'fresh','apply':'apply','export-json':'json','export-md':'md','filter-label':'filter','pin-note':'pinNote','empty-title':'emptyTitle','empty-note':'emptyNote','export-note':'exportNote','footer':'footer'}))label(id,k);$('language').textContent=language==='en'?'中文':'English';renderFilters();render()}
function render(){
